<div class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h4>Add Maintenance Record</h4><button class="modal-close" (click)="cancelled.emit()">✕</button></div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row g-2">
        <div class="col-12 form-group">
          <label class="form-label">Trip *</label>
          <select formControlName="tripId" class="form-control-ff"
                  [class.is-invalid]="f('tripId')?.invalid && f('tripId')?.touched">
            <option value="">Select Trip</option>
            <option *ngFor="let t of trips" [value]="t.tripId">#{{ t.tripId }} — {{ t.sourceLocation }} → {{ t.destinationLocation }}</option>
          </select>
          <div class="invalid-feedback" *ngIf="f('tripId')?.errors?.['required'] && f('tripId')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Maintenance Date *</label>
          <input type="date" formControlName="maintenanceDate" class="form-control-ff"
                 [class.is-invalid]="f('maintenanceDate')?.invalid && f('maintenanceDate')?.touched">
          <div class="invalid-feedback" *ngIf="f('maintenanceDate')?.errors?.['required'] && f('maintenanceDate')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Service Type *</label>
          <select formControlName="serviceType" class="form-control-ff"
                  [class.is-invalid]="f('serviceType')?.invalid && f('serviceType')?.touched">
            <option value="">Select Service Type</option>
            <option *ngFor="let s of serviceTypes" [value]="s">{{ s }}</option>
          </select>
          <div class="invalid-feedback" *ngIf="f('serviceType')?.errors?.['required'] && f('serviceType')?.touched">Required</div>
        </div>
        <div class="col-4 form-group">
          <label class="form-label">Total Cost (₹)</label>
          <input type="number" formControlName="cost" class="form-control-ff" placeholder="e.g. 5000">
        </div>
        <div class="col-4 form-group">
          <label class="form-label">Labor Cost (₹)</label>
          <input type="number" formControlName="laborCost" class="form-control-ff" placeholder="e.g. 2000">
        </div>
        <div class="col-4 form-group">
          <label class="form-label">Parts Cost (₹)</label>
          <input type="number" formControlName="partsCost" class="form-control-ff" placeholder="e.g. 3000">
        </div>

        <div class="col-6 form-group">
          <label class="form-label">Performed By *</label>
          <input formControlName="performedBy" class="form-control-ff"
                [class.is-invalid]="f('performedBy')?.invalid && f('performedBy')?.touched">
          <div class="invalid-feedback"
              *ngIf="f('performedBy')?.errors?.['required'] && f('performedBy')?.touched">
            Required
          </div>
        </div>


        <div class="col-6 form-group">
          <label class="form-label">Next Service Date</label>
          <input type="date" formControlName="nextServiceDate" class="form-control-ff"
                [class.is-invalid]="f('nextServiceDate')?.invalid && f('nextServiceDate')?.touched">
          <div class="invalid-feedback"
              *ngIf="f('nextServiceDate')?.errors?.['futureDate'] && f('nextServiceDate')?.touched">
            Must be a future date
          </div>
        </div>

        <div class="col-6 form-group">
          <label class="form-label">Status</label>
          <input formControlName="status" class="form-control-ff" placeholder="e.g. Completed">
        </div>
        <div class="col-12 form-group">
          <label class="form-label">Notes</label>
          <textarea formControlName="notes" class="form-control-ff" rows="2" placeholder="e.g. Engine oil replaced, air filter cleaned"></textarea>
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn-primary-ff">Add Record</button>
      </div>
    </form>
  </div>
</div>
