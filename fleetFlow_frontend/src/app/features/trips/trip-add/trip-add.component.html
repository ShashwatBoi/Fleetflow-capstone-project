<div class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h4>Add New Trip</h4><button class="modal-close" (click)="cancelled.emit()">✕</button></div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row g-2">
        <div class="col-6 form-group">
          <label class="form-label">Driver *</label>
          <select formControlName="driverId" class="form-control-ff"
                  [class.is-invalid]="f('driverId')?.invalid && f('driverId')?.touched">
            <option value="">Select Driver</option>
            <option *ngFor="let d of drivers" [value]="d.driverId">{{ d.driverName }}</option>
          </select>
          <div class="invalid-feedback" *ngIf="f('driverId')?.errors?.['required'] && f('driverId')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Vehicle *</label>
          <select formControlName="vehicleId" class="form-control-ff"
                  [class.is-invalid]="f('vehicleId')?.invalid && f('vehicleId')?.touched">
            <option value="">Select Vehicle</option>
            <option *ngFor="let v of vehicles" [value]="v.vehicleId">{{ v.vehicleNumber }}</option>
          </select>
          <div class="invalid-feedback" *ngIf="f('vehicleId')?.errors?.['required'] && f('vehicleId')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Start Date *</label>
          <input type="date" formControlName="startDate" class="form-control-ff"
                 [class.is-invalid]="f('startDate')?.invalid && f('startDate')?.touched">
          <div class="invalid-feedback" *ngIf="f('startDate')?.errors?.['required'] && f('startDate')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">End Date</label>
          <input type="date" formControlName="endDate" class="form-control-ff">
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Source Location *</label>
          <input formControlName="sourceLocation" class="form-control-ff" placeholder="e.g. Delhi"
                 [class.is-invalid]="f('sourceLocation')?.invalid && f('sourceLocation')?.touched">
          <div class="invalid-feedback" *ngIf="f('sourceLocation')?.errors?.['required'] && f('sourceLocation')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Destination *</label>
          <input formControlName="destinationLocation" class="form-control-ff" placeholder="e.g. Mumbai"
                 [class.is-invalid]="f('destinationLocation')?.invalid && f('destinationLocation')?.touched">
          <div class="invalid-feedback" *ngIf="f('destinationLocation')?.errors?.['required'] && f('destinationLocation')?.touched">Required</div>
        </div>
        <div class="col-4 form-group">
          <label class="form-label">Distance (km)</label>
          <input type="number" formControlName="distanceCovered" class="form-control-ff" placeholder="e.g. 1400">
        </div>
        <div class="col-4 form-group">
          <label class="form-label">Revenue (₹)</label>
          <input type="number" formControlName="revenue" class="form-control-ff" placeholder="e.g. 25000">
        </div>
        <div class="col-4 form-group">
          <label class="form-label">Fuel (L)</label>
          <input type="number" formControlName="fuelConsumed" class="form-control-ff" placeholder="e.g. 120">
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Status *</label>
          <select formControlName="tripStatus" class="form-control-ff">
            <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
          </select>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Purpose</label>
          <input formControlName="purpose" class="form-control-ff" placeholder="e.g. Goods delivery">
        </div>
        <div class="col-12 form-group">
          <label class="form-label">Notes</label>
          <textarea formControlName="notes" class="form-control-ff" rows="2" placeholder="e.g. Handle with care, fragile items"></textarea>
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn-primary-ff">Add Trip</button>
      </div>
    </form>
  </div>
</div>
