<div class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h4>Add New Driver</h4><button class="modal-close" (click)="cancelled.emit()">✕</button></div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row g-2">
        <div class="col-6 form-group">
          <label class="form-label">Username (Login) *</label>
          <input formControlName="username" class="form-control-ff" placeholder="e.g. driver_rahul"
                 [class.is-invalid]="f('username')?.invalid && f('username')?.touched">
          <div class="invalid-feedback" *ngIf="f('username')?.errors?.['required'] && f('username')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Driver Name *</label>
          <input formControlName="driverName" class="form-control-ff" placeholder="e.g. Rahul Kumar"
                 [class.is-invalid]="f('driverName')?.invalid && f('driverName')?.touched">
          <div class="invalid-feedback" *ngIf="f('driverName')?.errors?.['required'] && f('driverName')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">License Number *</label>
          <input formControlName="licenseNumber" class="form-control-ff" placeholder="e.g. DL0420110012345"
                 [class.is-invalid]="f('licenseNumber')?.invalid && f('licenseNumber')?.touched">
          <div class="invalid-feedback" *ngIf="f('licenseNumber')?.errors?.['required'] && f('licenseNumber')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Phone Number *</label>
          <input formControlName="phoneNumber" class="form-control-ff" placeholder="e.g. 9876543210"
                 [class.is-invalid]="f('phoneNumber')?.invalid && f('phoneNumber')?.touched">
          <div class="invalid-feedback" *ngIf="f('phoneNumber')?.errors?.['required'] && f('phoneNumber')?.touched">Required</div>
          <div class="invalid-feedback" *ngIf="f('phoneNumber')?.errors?.['pattern'] && f('phoneNumber')?.touched">Must be exactly 10 digits</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Email *</label>
          <input formControlName="emailId" class="form-control-ff" placeholder="e.g. rahul@example.com"
                 [class.is-invalid]="f('emailId')?.invalid && f('emailId')?.touched">
          <div class="invalid-feedback" *ngIf="f('emailId')?.errors?.['required'] && f('emailId')?.touched">Required</div>
          <div class="invalid-feedback" *ngIf="f('emailId')?.errors?.['email'] && f('emailId')?.touched">Enter a valid email</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Experience (yrs) *</label>
          <input type="number" formControlName="experience" class="form-control-ff" placeholder="e.g. 5"
                 [class.is-invalid]="f('experience')?.invalid && f('experience')?.touched">
          <div class="invalid-feedback" *ngIf="f('experience')?.errors?.['min'] && f('experience')?.touched">Cannot be negative</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">License Expiry *</label>
          <input type="date" formControlName="licenseExpiryDate" class="form-control-ff"
                 [class.is-invalid]="f('licenseExpiryDate')?.invalid && f('licenseExpiryDate')?.touched">
          <div class="invalid-feedback" *ngIf="f('licenseExpiryDate')?.errors?.['required'] && f('licenseExpiryDate')?.touched">Required</div>
          <div class="invalid-feedback" *ngIf="f('licenseExpiryDate')?.errors?.['minExpiry'] && f('licenseExpiryDate')?.touched">Must be at least 2 years from today</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Date of Birth *</label>
          <input type="date" formControlName="dateOfBirth" class="form-control-ff"
                 [class.is-invalid]="f('dateOfBirth')?.invalid && f('dateOfBirth')?.touched">
          <div class="invalid-feedback" *ngIf="f('dateOfBirth')?.errors?.['required'] && f('dateOfBirth')?.touched">Required</div>
          <div class="invalid-feedback" *ngIf="f('dateOfBirth')?.errors?.['minAge'] && f('dateOfBirth')?.touched">Driver must be at least 18 years old</div>
        </div>
        <div class="col-12 form-group">
          <label class="form-label">Address</label>
          <input formControlName="address" class="form-control-ff" placeholder="e.g. 45 MG Road, Delhi - 110001">
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn-primary-ff">Add Driver</button>
      </div>
    </form>
  </div>
</div>
