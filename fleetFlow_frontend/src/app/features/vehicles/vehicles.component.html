<div class="page-header">
  <div><h2>Vehicles 🚛</h2><p>Manage fleet vehicles and status</p></div>
  <button *ngIf="role === 'ADMIN' || role === 'MANAGER'" class="btn-primary-ff" (click)="showAddModal = true">+ Add Vehicle</button>
</div>

<app-vehicle-list
  [vehicles]="filtered"
  [warehouses]="warehouses"
  [loading]="loading"
  [role]="role"
  [vehicleTypes]="vehicleTypes"
  (filterChange)="applyFilter($event.warehouseId, $event.type, $event.status, $event.search)"
  (resetFilters)="resetFilters()"
  (checkAvailable)="onCheckAvailable($event)"
  (updateStatus)="openUpdate($event)">
</app-vehicle-list>

<app-vehicle-add *ngIf="showAddModal" [warehouses]="warehouses" (added)="showAddModal = false; load()" (cancelled)="showAddModal = false"></app-vehicle-add>
<app-vehicle-update *ngIf="showUpdateModal" [vehicle]="selectedVehicle" (updated)="showUpdateModal = false; load()" (cancelled)="showUpdateModal = false"></app-vehicle-update>

<div class="modal-overlay" *ngIf="showAvailableModal">
  <div class="modal-box">
    <div class="modal-header">
      <h4>✅ Available Vehicles</h4>
      <button class="modal-close" (click)="showAvailableModal = false">✕</button>
    </div>
    <table class="ff-table">
      <thead><tr><th>#</th><th>NUMBER</th><th>TYPE</th><th>MANUFACTURER</th><th>FUEL</th><th>STATUS</th></tr></thead>
      <tbody>
        <tr *ngFor="let v of availableVehicles; let i = index">
          <td>{{ i + 1 }}</td><td><strong>{{ v.vehicleNumber }}</strong></td><td>{{ v.vehicleType }}</td>
          <td>{{ v.manufacturer }}</td><td>{{ v.fuelType }}</td>
          <td><span class="badge-status badge-available">{{ v.currentStatus }}</span></td>
        </tr>
        <tr *ngIf="availableVehicles.length === 0"><td colspan="6" style="text-align:center;color:#94a3b8;padding:24px">No available vehicles</td></tr>
      </tbody>
    </table>
    <div class="d-flex justify-content-end mt-3">
      <button class="btn btn-outline-secondary" (click)="showAvailableModal = false">Close</button>
    </div>
  </div>
</div>
