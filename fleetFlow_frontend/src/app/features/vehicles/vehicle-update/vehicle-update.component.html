<div class="modal-overlay">
  <div class="modal-box" style="width:320px">
    <div class="modal-header"><h4>Update Status</h4><button class="modal-close" (click)="cancelled.emit()">✕</button></div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label class="form-label">Status *</label>
        <select formControlName="status" class="form-control-ff">
          <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
        </select>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn-primary-ff">Update</button>
      </div>
    </form>
  </div>
</div>
