<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><h1>🚛 FleetFlow</h1><p>Create Account</p></div>
    <div *ngIf="error" class="toast-msg toast-error mb-3">{{ error }}</div>
    <div *ngIf="success" class="toast-msg toast-success mb-3">{{ success }}</div>
    <form [formGroup]="form" (ngSubmit)="register()">
      <div class="row g-2">
        <div class="col-6 form-group">
          <label class="form-label">Username *</label>
          <input formControlName="username" class="form-control-ff" [class.is-invalid]="f('username')?.invalid && f('username')?.touched">
          <div class="invalid-feedback" *ngIf="f('username')?.errors?.['required'] && f('username')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Full Name</label>
          <input formControlName="fullName" class="form-control-ff">
        </div>
        <div class="col-12 form-group">
          <label class="form-label">Email *</label>
          <input formControlName="email" class="form-control-ff" [class.is-invalid]="f('email')?.invalid && f('email')?.touched">
          <div class="invalid-feedback" *ngIf="f('email')?.errors?.['required'] && f('email')?.touched">Required</div>
          <div class="invalid-feedback" *ngIf="f('email')?.errors?.['email'] && f('email')?.touched">Invalid email</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Password *</label>
          <input type="password" formControlName="password" class="form-control-ff" [class.is-invalid]="f('password')?.invalid && f('password')?.touched">
          <div class="invalid-feedback" *ngIf="f('password')?.errors?.['minlength'] && f('password')?.touched">Min 6 chars</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Role *</label>
          <select formControlName="role" class="form-control-ff">
            <option value="MANAGER">Manager</option>
            <option value="DRIVER">Driver</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn-primary-ff w-100 mt-3" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
    </form>
    <div style="text-align:center;margin-top:14px;font-size:0.85rem">
      <a routerLink="/auth/login" style="color:#4f46e5;text-decoration:none">Back to Login</a>
    </div>
  </div>
</div>
