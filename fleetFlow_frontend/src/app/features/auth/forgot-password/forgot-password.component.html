
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><h1>🚛 FleetFlow</h1><p>Reset Password</p></div>
    <div *ngIf="error" class="toast-msg toast-error mb-3">{{ error }}</div>
    <div *ngIf="success" class="toast-msg toast-success mb-3">{{ success }}</div>

    <div *ngIf="step === 1">
      <form [formGroup]="usernameForm" (ngSubmit)="getQuestion()">
        <div class="form-group">
          <label class="form-label">Username *</label>
          <input formControlName="username" class="form-control-ff" placeholder="Enter your username">
        </div>
        <button type="submit" class="btn-primary-ff w-100 mt-2">Get Security Question</button>
      </form>
    </div>

    <div *ngIf="step === 2">
      <p style="font-size:0.875rem;margin-bottom:14px;color:#374151"><strong>Question:</strong> {{ question }}</p>
      <form [formGroup]="answerForm" (ngSubmit)="verifyAnswer()">
        <div class="form-group">
          <label class="form-label">Your Answer *</label>
          <input formControlName="answer" class="form-control-ff">
        </div>
        <button type="submit" class="btn-primary-ff w-100 mt-2">Verify Answer</button>
      </form>
    </div>

    <div *ngIf="step === 3">
      <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">
        <div class="form-group">
          <label class="form-label">New Password *</label>
          <input type="password" formControlName="newPassword" class="form-control-ff">
        </div>
        <button type="submit" class="btn-primary-ff w-100 mt-2">Reset Password</button>
      </form>
    </div>

    <div style="text-align:center;margin-top:14px;font-size:0.85rem">
      <a routerLink="/auth/login" style="color:#4f46e5;text-decoration:none">Back to Login</a>
    </div>
  </div>
</div>
