<div class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h4>Add New Warehouse</h4>
      <button class="modal-close" (click)="cancelled.emit()">✕</button>
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row g-2">
        <div class="col-6 form-group">
          <label class="form-label">Warehouse Name *</label>
          <input formControlName="warehouseName" class="form-control-ff" placeholder="e.g. North Delhi Hub"
                 [class.is-invalid]="f('warehouseName')?.invalid && f('warehouseName')?.touched">
          <div class="invalid-feedback" *ngIf="f('warehouseName')?.errors?.['required'] && f('warehouseName')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Location *</label>
          <input formControlName="location" class="form-control-ff" placeholder="e.g. Delhi"
                 [class.is-invalid]="f('location')?.invalid && f('location')?.touched">
          <div class="invalid-feedback" *ngIf="f('location')?.errors?.['required'] && f('location')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Capacity *</label>
          <input type="number" formControlName="capacity" class="form-control-ff" placeholder="e.g. 100"
                 [class.is-invalid]="f('capacity')?.invalid && f('capacity')?.touched">
          <div class="invalid-feedback" *ngIf="f('capacity')?.errors?.['required'] && f('capacity')?.touched">Required</div>
          <div class="invalid-feedback" *ngIf="f('capacity')?.errors?.['min'] && f('capacity')?.touched">Minimum value is 1</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Manager Name *</label>
          <input formControlName="managerName" class="form-control-ff" placeholder="e.g. Rahul Sharma"
                 [class.is-invalid]="f('managerName')?.invalid && f('managerName')?.touched">
          <div class="invalid-feedback" *ngIf="f('managerName')?.errors?.['required'] && f('managerName')?.touched">Required</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Contact Number *</label>
          <input formControlName="contactNumber" class="form-control-ff" placeholder="e.g. 9876543210"
                 [class.is-invalid]="f('contactNumber')?.invalid && f('contactNumber')?.touched">
          <div class="invalid-feedback" *ngIf="f('contactNumber')?.errors?.['required'] && f('contactNumber')?.touched">Required</div>
          <div class="invalid-feedback" *ngIf="f('contactNumber')?.errors?.['pattern'] && f('contactNumber')?.touched">Must be exactly 10 digits</div>
        </div>
        <div class="col-6 form-group">
          <label class="form-label">Email</label>
          <input formControlName="email" class="form-control-ff" placeholder="e.g. warehouse@fleetflow.com"
                 [class.is-invalid]="f('email')?.invalid && f('email')?.touched">
          <div class="invalid-feedback" *ngIf="f('email')?.errors?.['email'] && f('email')?.touched">Enter a valid email</div>
        </div>
        <div class="col-12 form-group">
          <label class="form-label">Address</label>
          <textarea formControlName="address" class="form-control-ff" rows="2" placeholder="e.g. Plot 12, Industrial Area, Delhi - 110001"></textarea>
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn-primary-ff">Add Warehouse</button>
      </div>
    </form>
  </div>
</div>
