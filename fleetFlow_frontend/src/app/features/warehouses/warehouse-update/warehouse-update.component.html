
<div class="modal-overlay">
  <div class="modal-box" style="width:360px">
    <div class="modal-header">
      <h4>Update Capacity</h4>
      <button class="modal-close" (click)="cancelled.emit()">✕</button>
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label class="form-label">New Capacity *</label>
        <input type="number" formControlName="capacity" class="form-control-ff">
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn-primary-ff">Update</button>
      </div>
    </form>
  </div>
</div>
